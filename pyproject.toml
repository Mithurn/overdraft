[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudai"
version = "0.3.0"
description = "When Claude Code runs out, keep the same conversation on your free backends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "litellm[proxy]>=1.60",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
cloudai = "localbot.cli:main"
localbot = "localbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localbot = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
